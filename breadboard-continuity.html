<script>
(()=>{'use strict';
const root=document.getElementById('breadboard-lab'),svg=root.querySelector('#scene'),NS='http://www.w3.org/2000/svg';
const $=id=>root.querySelector('#'+id); const holes=[],byId=new Map(),wires=[];
svg.insertBefore($('meter'),$('probes')); // Keep loose leads behind the meter face.
let tool='red',start=null,selected=null,nextId=1,drag=null,sound=false,audio=null,osc=null,gain=null,lastConnected=null;
const probes={red:{x:90,y:299,hole:'a1',present:true},black:{x:90,y:371,hole:'e1',present:true}};
function el(tag,attrs,parent,text){const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(text!==undefined)n.textContent=text;if(parent)parent.appendChild(n);return n;}
function hole(id,x,y,net,label){const h={id,x,y,net,label};holes.push(h);byId.set(id,h);}
for(let n=1;n<=30;n++){let x=90+(n-1)*31;for(let j=0;j<5;j++){hole('abcde'[j]+n,x,299+j*18,'top'+n,'abcde'[j].toUpperCase()+n);hole('fghij'[j]+n,x,431+j*18,'bottom'+n,'fghij'[j].toUpperCase()+n);}for(const [rail,y] of [['tp',239],['tn',261],['bp',551],['bn',573]])hole(rail+n,x,y,rail,rail.toUpperCase()+' '+n);}
function network(){const p={};holes.forEach(h=>p[h.id]=h.id);const find=x=>p[x]===x?x:(p[x]=find(p[x]));const join=(a,b)=>p[find(a)]=find(b);const groups=new Map();holes.forEach(h=>{const k=h.net;if(groups.has(k))join(h.id,groups.get(k));else groups.set(k,h.id)});wires.forEach(w=>join(w.a,w.b));return {find,connected:(a,b)=>!!a&&!!b&&find(a)===find(b)};}
function nearest(x,y){let best=null,d=13;for(const h of holes){const dd=Math.hypot(x-h.x,y-h.y);if(dd<d){d=dd;best=h}}return best;}
function point(event){const p=svg.createSVGPoint();p.x=event.clientX;p.y=event.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function setProbe(name,x,y,snap){let h=nearest(x,y);probes[name]={x:snap&&h?h.x:x,y:snap&&h?h.y:y,hole:h?h.id:null,present:true};render();}
function choose(id){const h=byId.get(id);if(tool==='link'){if(!start){start=id;selected=null;render()}else if(start===id){start=null;render()}else{if(!wires.some(w=>(w.a===start&&w.b===id)||(w.b===start&&w.a===id)))wires.push({id:nextId++,a:start,b:id});start=null;render()}}else{setProbe(tool,h.x,h.y,true)}}
function setTool(t){tool=t;start=null;selected=null;if(t!=='link'&&!probes[t].present){const p=probes[t];p.present=true;const h=nearest(p.x,p.y);p.hole=h?h.id:null;}root.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===t));render();}
function tone(on){if(!audio||!osc||!gain)return;gain.gain.setTargetAtTime(on&&sound?.035:0,audio.currentTime,.025);}
function render(){const net=network(),a=probes.red.hole,b=probes.black.hole,c=net.connected(a,b);$('display').textContent=c?'CONNECTED':'OL · OPEN';$('meter-detail').textContent=c?'Conducting path':(!a||!b?'Both probes must touch':'No conducting path');$('probe-labels').textContent='Red: '+(a?byId.get(a).label:probes.red.present?'not touching':'removed')+'   ·   Black: '+(b?byId.get(b).label:probes.black.present?'not touching':'removed');
if(c!==lastConnected){tone(c);lastConnected=c}
$('status').textContent=start?'Link started at '+byId.get(start).label+'. Choose its other end.':selected!==null?'Metal link selected.':tool==='link'?'Choose two holes for a metal link.':!probes[tool].present?'Select “Add '+tool+' probe” to bring it back.':'Drag the '+tool+' probe or click a hole to place its tip.';
const remove=$('remove');remove.textContent=selected!==null?'Remove metal link':tool==='link'?'Remove metal link':'Remove '+tool+' probe';remove.disabled=selected===null&&(tool==='link'||!probes[tool].present);
root.querySelectorAll('[data-tool]').forEach(b=>{if(b.dataset.tool!=='link')b.textContent=(probes[b.dataset.tool].present?'':'Add ')+b.dataset.tool[0].toUpperCase()+b.dataset.tool.slice(1)+' probe';});
const inside=$('inside');inside.replaceChildren();if($('reveal').checked){for(let n=1;n<=30;n++){const x=90+(n-1)*31;el('path',{d:`M${x} 299V371 M${x} 431V503`,stroke:'#c89b4c','stroke-width':10,'stroke-linecap':'round',opacity:.45},inside)}for(const y of [239,261,551,573]){const ranges=[[90,989]];ranges.forEach(([x1,x2])=>el('line',{x1,y1:y,x2,y2:y,stroke:'#c89b4c','stroke-width':10,'stroke-linecap':'round',opacity:.45},inside))}}
$('rail-marks').replaceChildren();for(const [y,col,label] of [[226,'#be4045','+'],[280,'#326e99','−'],[534,'#be4045','+'],[590,'#326e99','−']]){const ranges=[[83,996]];ranges.forEach(([x1,x2])=>el('line',{x1,y1:y,x2,y2:y,stroke:col,'stroke-width':2},$('rail-marks')));el('text',{x:66,y:y+5,'font-size':17,fill:col},$('rail-marks'),label)}
root.querySelectorAll('.hole').forEach(g=>{const h=byId.get(g.dataset.id),circle=g.querySelector('circle');const active=$('reveal').checked&&((a&&net.connected(a,h.id))||(b&&net.connected(b,h.id)));circle.setAttribute('fill',active?'#b878e8':'#5d6b65');circle.setAttribute('stroke',start===h.id?'#e3952c':'#c8d2cb');circle.setAttribute('stroke-width',start===h.id?3:1)});
const links=$('links');links.replaceChildren();wires.forEach((w,i)=>{const a=byId.get(w.a),b=byId.get(w.b),bend=Math.max(16,Math.min(40,Math.abs(a.x-b.x)/5));const d=`M${a.x} ${a.y} Q${(a.x+b.x)/2} ${(a.y+b.y)/2-bend} ${b.x} ${b.y}`;el('path',{d,fill:'none',stroke:'#899690','stroke-width':7,'stroke-linecap':'round','pointer-events':'none',class:w.id===selected?'wire-selected':''},links);const hit=el('path',{d,fill:'none',stroke:'transparent','stroke-width':18,class:'link-hit',tabindex:0,role:'button','aria-label':`Select metal link from ${a.label} to ${b.label}`},links);hit.addEventListener('pointerdown',e=>e.stopPropagation());hit.addEventListener('click',e=>{e.stopPropagation();selected=w.id;start=null;render()});hit.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=w.id;render()}});for(const h of [a,b])el('circle',{cx:h.x,cy:h.y,r:4,fill:'#c6ccc8','pointer-events':'none'},links)});
const leads=$('leads');leads.replaceChildren();for(const [name,sx,color]of [['black',740,'#26383d'],['red',944,'#cc4446']]){const p=probes[name];const g=$('probe-'+name);g.style.display=p.present?'':'none';if(!p.present)continue;el('path',{d:`M${sx} 171 C${sx} 195 ${p.x+65} ${p.y-115} ${p.x+25} ${p.y-58}`,fill:'none',stroke:color,'stroke-width':4,'stroke-linecap':'round'},leads);g.setAttribute('transform',`translate(${p.x} ${p.y})`);g.setAttribute('aria-label',`${name} probe tip, ${p.hole?byId.get(p.hole).label:'not touching a hole'}. Arrow keys move freely.`);g.querySelector('.contact').setAttribute('fill',p.hole?'#5a108f':'#85928d')}
$('pending').replaceChildren();if(start){const h=byId.get(start);el('circle',{cx:h.x,cy:h.y,r:10,fill:'none',stroke:'#e3952c','stroke-width':3},$('pending'))}}
for(const h of holes){const g=el('g',{class:'hole','data-id':h.id,tabindex:0,role:'button','aria-label':'Breadboard hole '+h.label},$('holes'));el('rect',{x:h.x-13,y:h.y-9,width:26,height:18,fill:'transparent'},g);el('circle',{cx:h.x,cy:h.y,r:4.3,fill:'#5d6b65',stroke:'#c8d2cb'},g);g.addEventListener('click',()=>choose(h.id));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(h.id)}})}
for(let n=1;n<=30;n++){el('text',{x:90+(n-1)*31,y:290,'text-anchor':'middle','font-size':11,fill:'#40534a'},$('holes'),n);el('text',{x:90+(n-1)*31,y:523,'text-anchor':'middle','font-size':11,fill:'#40534a'},$('holes'),n)}
for(let j=0;j<5;j++)for(const [letters,y]of [['abcde',299],['fghij',431]])el('text',{x:67,y:y+j*18+4,'font-size':12,fill:'#40534a'},$('holes'),letters[j]);
for(const [name,color]of [['black','#26383d'],['red','#cc4446']]){const g=el('g',{id:'probe-'+name,class:'probe',tabindex:0,role:'button'},$('probes'));el('circle',{cx:0,cy:0,r:13,fill:'transparent'},g);el('line',{x1:0,y1:0,x2:13,y2:-29,stroke:'#8c9692','stroke-width':5,'stroke-linecap':'round'},g);el('path',{d:'M8 -28 L28 -68 Q38 -77 43 -64 L23 -22 Z',fill:color,stroke:'#f6f8f5','stroke-width':1,class:'handle'},g);el('circle',{cx:0,cy:0,r:3,class:'contact'},g);g.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();setTool(name);drag={name,pointerId:e.pointerId};svg.setPointerCapture(e.pointerId)});g.addEventListener('keydown',e=>{const moves={ArrowLeft:[-8,0],ArrowRight:[8,0],ArrowUp:[0,-8],ArrowDown:[0,8]};if(moves[e.key]){e.preventDefault();const p=probes[name],d=moves[e.key];setProbe(name,Math.max(0,Math.min(1100,p.x+d[0])),Math.max(0,Math.min(650,p.y+d[1])),false)}})}
svg.addEventListener('pointermove',e=>{if(drag&&drag.pointerId===e.pointerId){const p=point(e);setProbe(drag.name,Math.max(0,Math.min(1100,p.x)),Math.max(0,Math.min(650,p.y)),false)}});
function stop(e){if(drag&&e.pointerId===drag.pointerId){const p=probes[drag.name];setProbe(drag.name,p.x,p.y,true);drag=null;if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId)}}svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);svg.addEventListener('lostpointercapture',()=>{drag=null});
svg.addEventListener('click',e=>{if(tool==='link'||!probes[tool].present||e.target.closest('.hole,.probe,.link-hit'))return;const p=point(e);setProbe(tool,p.x,p.y,false)});
root.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
$('remove').addEventListener('click',()=>{if(selected!==null){const i=wires.findIndex(w=>w.id===selected);if(i>=0)wires.splice(i,1);selected=null;}else if(tool!=='link'){probes[tool].present=false;probes[tool].hole=null;}render()});$('reveal').addEventListener('change',render);
$('reset').addEventListener('click',()=>{wires.length=0;selected=null;start=null;probes.red={x:90,y:299,hole:'a1',present:true};probes.black={x:90,y:371,hole:'e1',present:true};$('reveal').checked=false;setTool('red')});
$('sound').addEventListener('click',async()=>{sound=!sound;if(sound&&!audio){try{audio=new(window.AudioContext||window.webkitAudioContext)();osc=audio.createOscillator();gain=audio.createGain();osc.frequency.value=1700;gain.gain.value=0;osc.connect(gain);gain.connect(audio.destination);osc.start()}catch(e){sound=false;$('status').textContent='Audio unavailable; the display still shows continuity.'}}if(audio&&audio.state==='suspended')await audio.resume();$('sound').textContent='Sound: '+(sound?'on':'off');$('sound').setAttribute('aria-pressed',sound);tone(network().connected(probes.red.hole,probes.black.hole))});
document.addEventListener('visibilitychange',()=>tone(!document.hidden&&network().connected(probes.red.hole,probes.black.hole)));
const fullscreenButton=$('fullscreen');
let fullscreenBlocked=false;
if(new URLSearchParams(location.search).get('view')==='fullscreen')document.body.classList.add('expanded');
fullscreenButton.addEventListener('click',async(event)=>{
 if(document.fullscreenElement){
  event.preventDefault();
  await document.exitFullscreen();
  return;
 }
 // A native link opens reliably inside previews that disallow the Fullscreen API.
 if(!document.fullscreenEnabled||!root.requestFullscreen||fullscreenBlocked)return;
 event.preventDefault();
 try{await root.requestFullscreen();}
 catch(error){
  fullscreenBlocked=true;
  fullscreenButton.textContent='⛶ Open full-screen view';
  $('status').textContent='This preview blocks browser full screen. Click Open full-screen view to open the app in its own tab.';
 }
});
document.addEventListener('fullscreenchange',()=>{
 const active=document.fullscreenElement===root;
 fullscreenButton.textContent=active?'Exit full screen':'⛶ Full screen';
 fullscreenButton.setAttribute('aria-label',active?'Exit breadboard full screen':'Open breadboard full screen');
});
render();
})();
</script></body></html>
