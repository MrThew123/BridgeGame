<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440">
<title>Bridge Lab original game parts</title>
<defs>
<g id="road"><path d="M0 0h120" stroke="#334f4a" stroke-width="12" stroke-linecap="round"/><path d="M4 -2h112" stroke="#d8e8df" stroke-width="2" stroke-dasharray="10 9"/></g>
<g id="truss-beam"><path d="M0 0h120" stroke="#b78249" stroke-width="6" stroke-linecap="round"/><path d="M0 -1h120" stroke="#deb283" stroke-width="1"/></g>
<g id="metal-beam"><path d="M0 0h120" stroke="#657f8e" stroke-width="8" stroke-linecap="round"/><path d="M0 -1h120" stroke="#c8d4dc" stroke-width="1"/></g>
<g id="rock-anchor"><path d="M-26 50v-35L-8 -5 16 -2 30 20 35 50" fill="#789596"/><path d="M0 -12 12 0 0 12 -12 0Z" fill="#466b6c" stroke="#e5efed" stroke-width="3"/></g>
<g id="joint"><circle r="7" fill="#fff" stroke="#44675b" stroke-width="3"/></g>
<g id="hinge"><circle r="12" fill="#385a50"/><circle r="4" fill="#fff"/></g>
<g id="counterweight"><rect x="-20" y="-34" width="40" height="34" rx="3" fill="#477c78"/><path d="M-8 -34v-7h16v7" fill="none" stroke="#477c78" stroke-width="4"/><text x="0" y="-13" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#d8efeb">50 kg</text></g>
<g id="geared-drive"><rect x="-40" y="8" width="60" height="30" rx="5" fill="#385c60"/><rect x="-53" y="13" width="18" height="20" rx="3" fill="#668e8b"/><path d="M10 20 35 0" stroke="#809c91" stroke-width="7"/><circle cx="35" r="19" fill="#456962"/><circle cx="35" r="13" fill="none" stroke="#d2dfda" stroke-width="3"/><path d="M26 0h21" stroke="#e9f2ee" stroke-width="5"/></g>
<g id="reinforced-road"><path d="M0 0h120" stroke="#3d6874" stroke-width="14" stroke-linecap="round"/><path d="M4 -2h112" stroke="#d8e8df" stroke-width="2" stroke-dasharray="10 9"/><path d="M4 5h112" stroke="#a6c5cb" stroke-width="2"/></g>
<g id="bank"><path d="M0 0h150v70H0" fill="#648c78"/><path d="M0 0h150v12H0" fill="#70b293"/><path d="M0 4h150" stroke="#385850" stroke-width="5"/><path d="M15 40h25m25 0h25m25 0h25" stroke="#577967" stroke-width="8"/></g>
<g id="water"><rect width="150" height="70" fill="#7fc8ce"/><path d="M10 20h30m30 0h30m-65 25h30m30 0h30" stroke="#b4e9e9" stroke-width="2"/></g>
<g id="broken-road"><path d="M0 0h50l6 12m14 8 6-10h44" stroke="#d9654d" stroke-width="10" fill="none"/></g>
