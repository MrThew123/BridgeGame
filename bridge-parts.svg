<use href="#geared-drive" x="62" y="227"/><text x="120" y="251">Geared drive</text>
<use href="#bank" x="255" y="220"/><text x="255" y="316">Bank</text>
<use href="#water" x="495" y="220"/><text x="495" y="316">Water</text>
<use href="#metal-beam" x="30" y="367"/><text x="30" y="403">Metal beam</text>
<use href="#rock-anchor" x="283" y="355"/><text x="335" y="380">Fixed rock anchor</text>
