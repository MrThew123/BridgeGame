<use href="#truss-beam" x="255" y="52"/><text x="255" y="85">Wood beam</text>
<use href="#broken-road" x="495" y="52"/><text x="495" y="85">Failed deck</text>
<use href="#joint" x="42" y="142"/><text x="65" y="147">Joint</text>
